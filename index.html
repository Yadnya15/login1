<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
   <style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;

        /* DARK BODY GRADIENT */
        background: linear-gradient(
            135deg,
            #b35600,
            #4d016b,
            #172554,
            #6d034a
        );
    }

    form {
        width: 450px;
        max-width: 100%;
        margin: auto;
        padding: 35px;

        /* LIGHT FORM GRADIENT */
        background: linear-gradient(
            145deg,
            #eb57de,
            #65ebb3,
            #ffe677
        );

        border-radius: 20px;

        box-shadow:
            0 20px 50px rgba(0, 0, 0, 0.45),
            0 0 25px rgba(99, 102, 241, 0.20);
    }

    h1 {
        text-align: center;
        color: #312E81;
        font-size: 28px;
        margin-top: 0;
        margin-bottom: 30px;
    }

    legend {
        color: #172554;
        font-weight: bold;
        font-size: 15px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="tel"],
    input[type="date"],
    textarea,
    select {
        width: 100%;
        padding: 12px;
        margin-top: 7px;
        margin-bottom: 18px;

        background: #FFFFFF;
        color: #0F172A;

        border: 1px solid #C7D2FE;
        border-radius: 9px;

        font-size: 15px;
    }

    input::placeholder,
    textarea::placeholder {
        color: #64748B;
    }

    input:focus,
    textarea:focus,
    select:focus {
        outline: none;

        border-color: #6366F1;

        box-shadow:
            0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    textarea {
        height: 90px;
        resize: vertical;
    }

    input[type="radio"],
    input[type="checkbox"] {
        accent-color: #4F46E5;
    }

    .option {
        color: #334155;
        margin-bottom: 18px;
    }

    input[type="submit"],
    input[type="reset"] {
        padding: 12px 28px;

        border: none;
        border-radius: 9px;

        font-size: 15px;
        cursor: pointer;

        transition: 0.3s;
    }

    input[type="submit"] {
        background: linear-gradient(
            135deg,
            #2563EB,
            #4F46E5,
            #7C3AED
        );

        color: white;

        box-shadow:
            0 5px 15px rgba(79, 70, 229, 0.30);
    }

    input[type="submit"]:hover {
        transform: translateY(-2px);

        box-shadow:
            0 8px 20px rgba(79, 70, 229, 0.40);
    }

    input[type="reset"] {
        background: #DDD6FE;
        color: #312E81;
    }

    input[type="reset"]:hover {
        background: #C4B5FD;
        transform: translateY(-2px);
    }
</style>
    <body>
        <form action="portfolio.html" method="get">
            <legend>Name</legend><br>
            <input type="text" required><br><br>
            <legend>Email</legend><br>
            <input type="email" required><br><br>
            <legend>Password</legend><br>
            
<input type="password" id="password" required>

<input type="checkbox"
onclick="document.getElementById('password').type = this.checked ? 'text' : 'password'">

Show Password

<br><br>
             <legend>Ph.No</legend><br>
            <input type="tel" required><br><br>
            <legend>Date Of Birth</legend><br>
            <input type="date" required><br><br>
            <legend>Gender</legend><br>
            <input type="radio">Male<input type="radio">Female<br><br>
            <legend>Address</legend><br>
            <textarea rows="4" cols="30" required></textarea><br><br>
            <legend>City</legend><br>
            <select name="city" required>
                <option value="" selected disabled>Select City</option>
                <option>Pune</option>
                <option>Mumbai</option>
                <option>Ahilyanagar</option>
                <option>Other</option>
            </select><br><br>
            <input type="submit"><input type="reset">
        </form>
    </body>
</html>
